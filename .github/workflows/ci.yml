name: CI Checks

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc -b && vite build)
        run: npm run build

  parse-fit-tests:
    runs-on: ubuntu-latest
    name: Parse FIT Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run fitDataParser tests
        run: npm run test:run src/utils/__tests__/fitDataParser.test.ts

